name: Flutter validation and Android preview

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-inventory:
    name: Source revision and dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve locked web dependencies
        run: npm ci --prefix web
      - name: Generate web SPDX software bill of materials
        run: |
          mkdir -p dist/release-inventory
          npm sbom --prefix web --sbom-format=spdx --sbom-type=application > dist/release-inventory/web.spdx.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies and record dependency graph
        run: |
          flutter create . --project-name hotice --platforms=android,ios
          flutter pub get
          flutter pub deps --json > dist/release-inventory/flutter-dependencies.json
      - name: Record source revision and workflow run
        env:
          HOTICE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e 'const fs=require("node:fs"); fs.writeFileSync("dist/release-inventory/build.json", JSON.stringify({repository:process.env.GITHUB_REPOSITORY, sourceRevision:process.env.HOTICE_SOURCE_REVISION, workflowRevision:process.env.GITHUB_SHA, workflowRun:process.env.GITHUB_RUN_ID, runAttempt:process.env.GITHUB_RUN_ATTEMPT}, null, 2)+"\n")'
      - name: Upload release dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: HOTICE-release-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/release-inventory/
          retention-days: 90
          if-no-files-found: error

  validate:
    name: Flutter analysis and unit/widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platform scaffolds
        run: flutter create . --project-name hotice --platforms=android,ios
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test test/

  android-preview:
    name: Versioned Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name hotice --platforms=android
      - name: Install HOTICE preview icon
        run: python3 tools/brand_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile identifiable Android APK
        shell: bash
        run: |
          BUILD_ID="${GITHUB_SHA:0:8}"
          flutter build apk --debug --build-number "$GITHUB_RUN_NUMBER" --dart-define="HOTICE_BUILD_ID=$BUILD_ID"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/HOTICE-v0.2.0-run${GITHUB_RUN_NUMBER}-${BUILD_ID}.apk"
      - name: Upload distinct HOTICE Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HOTICE-Android-v0.2.0-run${{ github.run_number }}
          path: dist/HOTICE-*.apk
          retention-days: 14
          if-no-files-found: error

  android-emulator:
    name: Real Android emulator smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=idle"' | sudo tee /etc/udev/rules.d/99-hotice-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name hotice --platforms=android
      - name: Fetch dependencies
        run: flutter pub get
      - name: Launch real Android emulator and test user journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/android_smoke_test.dart -d emulator-5554 --dart-define=HOTICE_BUILD_ID=ANDROIDTEST

  web-validate:
    name: Static Namecheap web and Inspiration catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --check web/public/assets/site.js
      - name: Verify public-site assets, prompts and rights metadata
        run: python3 tools/check_web.py
      - name: Install browser dry-run dependency
        run: npm ci --prefix web
      - name: Install Chromium for the local mock workflow
        run: npx --prefix web playwright install --with-deps chromium
      - name: Exercise local-first and consent-based cloud project workflow
        run: node tools/e2e_web_project_sync.cjs
