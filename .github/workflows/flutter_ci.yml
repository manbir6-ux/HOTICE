name: Flutter validation and Android preview

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Repeated commits used to launch multiple parallel 1GB emulator/SDK builds,
# causing resource contention and flaky Android SDK downloads. Run only the
# newest commit for each PR/ref; releases still get their own run.
concurrency:
  group: hotice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Flutter analysis and unit/widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platform scaffolds
        run: flutter create . --project-name hotice --platforms=android,ios
      - name: Configure HOTICE mobile permissions and ML Kit SDK targets
        run: python3 tools/prepare_mobile_camera.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test test/

  android-preview:
    name: Versioned Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name hotice --platforms=android
      - name: Configure HOTICE mobile permissions and ML Kit SDK targets
        run: python3 tools/prepare_mobile_camera.py
      - name: Install HOTICE preview icon
        run: python3 tools/brand_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile identifiable Android APK
        shell: bash
        run: |
          BUILD_ID="${GITHUB_SHA:0:8}"
          flutter build apk --debug --build-number "$GITHUB_RUN_NUMBER" --dart-define="HOTICE_BUILD_ID=$BUILD_ID"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/HOTICE-v0.2.0-run${GITHUB_RUN_NUMBER}-${BUILD_ID}.apk"
      - name: Upload distinct HOTICE Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HOTICE-Android-v0.2.0-run${{ github.run_number }}
          path: dist/HOTICE-*.apk
          retention-days: 14
          if-no-files-found: error

  android-emulator:
    name: Real Android emulator smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=idle"' | sudo tee /etc/udev/rules.d/99-hotice-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name hotice --platforms=android
      - name: Configure HOTICE mobile permissions and ML Kit SDK targets
        run: python3 tools/prepare_mobile_camera.py
      - name: Fetch dependencies
        run: flutter pub get
      - name: Launch real Android emulator and test user journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/android_smoke_test.dart -d emulator-5554 --dart-define=HOTICE_BUILD_ID=ANDROIDTEST

  web-validate:
    name: Static Namecheap web and Inspiration catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check web/public/assets/site.js
          node --check web/public/assets/timeline_core.js
      - name: Exercise timeline selection and reorder regression tests
        run: node web/tests/timeline.test.cjs
      - name: Verify public-site assets, prompts and rights metadata
        run: python3 tools/check_web.py
      - name: Validate optional private 3D worker consent and cleanup contract
        run: python3 -m unittest discover -s workers/actor3d/tests -v
      - name: Configure PHP 8.3 for server-only Omni request contract
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Validate Gemini Omni backend payload and input rejection
        run: php -l server/src/GeminiOmniPayload.php && php server/tests/test_omni_payload.php
