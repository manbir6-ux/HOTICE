name: HOTICE PHP Backend Security & API
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
jobs:
  php-static:
    name: PHP syntax and defensive core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo
      - name: PHP syntax lint
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Self tests
        run: php backend/tests/smoke.php

  php-mysql-integration:
    name: Auth, owner console, cloud entitlement, media and storage integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_ci_only_password
          MYSQL_DATABASE: hotice_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -plocal_ci_only_password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dry-run dependency
        run: npm ci --prefix web
      - name: Install Chromium for real API browser integration
        run: npx --prefix web playwright install --with-deps chromium
      - name: Write CI-only settings (NOT deployment secrets)
        run: |
          cat > backend/config.php <<'PHP'
          <?php
          return [
            'db' => [
              'dsn' => 'mysql:host=127.0.0.1;dbname=hotice_test;charset=utf8mb4',
              'user' => 'root',
              'password' => 'local_ci_only_password',
            ],
            'app_key' => str_repeat('a', 64),
            'storage_path' => __DIR__ . '/private-media',
            'require_https' => false, // ONLY CI HTTP localhost
            'web_allowed_origins' => ['http://127.0.0.1:4173'], // ONLY CI browser client
            'allow_registration' => true, // ONLY CI test user creation
            'token_ttl_hours' => 1,
            'max_file_bytes' => 1048576,
            'max_project_bytes' => 131072,
            'max_cloud_projects' => 1,
            'max_files_per_project' => 1,
            'web_allowed_origins' => ['http://127.0.0.1:4173'], // ONLY local browser integration test
            'mock_jobs_enabled' => true,
            'mock_job_cost_credits' => 5,
            'mock_job_quote_ttl_seconds' => 300,
          ];
          PHP
      - name: Initialize SQL schema
        run: php backend/bin/install.php
      - name: HTTP cloud API integration
        run: bash backend/tests/http-integration.sh
      - name: Owner MFA console and encrypted provider settings
        run: bash backend/tests/admin-integration.sh
      - name: Mock generation quotes, idempotency, retries and refunds
        run: bash backend/tests/jobs-integration.sh
      - name: Real browser to PHP/MySQL authenticated mock-job dry run
        env:
          HOTICE_E2E_EMAIL: browser-api-dry-run@example.test
          HOTICE_E2E_PASSWORD: BrowserDryRunOnlyPassword123!
          HOTICE_TEST_API_ORIGIN: http://127.0.0.1:18887
        run: |
          printf '%s\\n' "$HOTICE_E2E_PASSWORD" | php backend/bin/create-user.php "$HOTICE_E2E_EMAIL"
          php backend/bin/grant-mock-credits.php "$HOTICE_E2E_EMAIL" 20 browser-api-dry-run-credit-0001
          php -S 127.0.0.1:18887 -t backend/public backend/public/router.php >/tmp/hotice-browser-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do if curl -fsS "$HOTICE_TEST_API_ORIGIN/health" >/dev/null; then break; fi; sleep 0.25; done
          HOTICE_E2E_WEB_PORT=4173 node tools/e2e_web_real_api.cjs
