name: hotice
description: HOTICE - cinematic AI video studio UI prototype.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  file_picker: ^13.2.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  path_provider: ^2.1.6
  image: ^4.10.2
  archive: ^4.5.2
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - web/public/assets/inspiration.json
