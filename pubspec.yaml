name: hotice
description: HOTICE - cinematic AI video studio UI prototype.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  file_picker: ^13.2.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - web/public/assets/inspiration.json
