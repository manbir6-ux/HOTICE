name: hotice
description: HOTICE - cinematic AI video studio UI prototype.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  file_picker: ^13.3.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - web/public/assets/inspiration.json
